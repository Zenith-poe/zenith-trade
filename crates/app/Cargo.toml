[package]
name = "zenith-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "zenith"
path = "src/main.rs"

[dependencies]
zenith-core = { path = "../core" }
zenith-data = { path = "../data" }
zenith-trade = { path = "../trade" }
zenith-prices = { path = "../prices" }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "clipboard"] }
png = "0.18"
miniz_oxide = "0.8"
serde_json = "1.0.154"
ureq = "3.5.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
velopack = "1.2.161"

[dev-dependencies]
httpmock = "0.9.0"

[features]
# Developer and test tooling, off in a user build.
dev = []
# Experiment only: `cargo build --release --features wgpu` renders through wgpu instead of OpenGL.
wgpu = ["eframe/wgpu"]

[build-dependencies]
winresource = "0.1"
